# RFC 9946 section 12: IANA Considerations.
# Format and ID convention: docs/conformance/README.md.
# Section 12 has no BCP 14 keywords. The registry values are captured as
# requirements on the codec: each entry quotes the sentence that introduces
# its table, and the note names the values. Sections 12.3 and 12.4 have none.

