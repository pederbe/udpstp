text = "IANA has registered the following service name in the \"Service Name and Transport Protocol Port Number Registry\":"
text_sha256 = "18b45e56df3b7b09"
state = "pending"
note = "Service Name and Transport Protocol Port Number Registry: udpstp, UDP port 24601, the Standard Port."

