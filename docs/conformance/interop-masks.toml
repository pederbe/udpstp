# Generated by `cargo xtask req` from the masks in docs/conformance/records/;
# don't edit it by hand. Each entry is a field of a Control PDU, named as in
# src/wire, that the OB-UDPST interop comparison ignores, in runs where
# every condition in `when` holds (none: every run), because of `records`.

# What each condition means.
[conditions]
upstream = "an Upstream Test"
downstream = "a Downstream Test"
fixed-rate = "a Fixed-Rate Test"
default-search = "a search from row 0: no starting row requested"
operator-key = "the Test Connection's key is an Operator Key"
consumer-key = "the Test Connection's key isn't an Operator Key"
max-bandwidth-stated = "the Setup Request states a maxBandwidth"
no-max-bandwidth-stated = "the Setup Request states no maxBandwidth"
row-above-max-bandwidth = "a requested starting or Fixed-Rate row above the stated maxBandwidth's row"
start-row-above-100 = "a requested starting row above 100"
row-above-1000 = "a requested starting or Fixed-Rate row above 1000"
row-beyond-the-top-row = "a requested row above the Server's top row (1069 with a 1500-byte MTU)"
test-interval-over-60s = "a requested Test Interval above 60 s"
coerced-parameters = "Activation parameters udpstp coerces: outside its ranges, lowThresh above upperThresh, subIntPeriod longer than the Test or not a whole number of Trial Intervals, or slowAdjThresh × trialInt above 500 ms"
dscp-requested = "a nonzero dscpEcn"
unauthenticated = "Unauthenticated Mode"
troubleshooting-mode = "the Server runs in Troubleshooting Mode"

[[mask]]
pdu = "setup-request"
field = "max_bandwidth"
when = ["no-max-bandwidth-stated", "upstream"]
records = ["usdir-set-on-every-upstream-setup"]

[[mask]]
pdu = "activation-response"
field = "cmd_response"
when = ["consumer-key", "fixed-rate"]
records = ["fixed-rate-needs-operator-key"]

[[mask]]
pdu = "activation-response"
field = "dscp_ecn"
when = ["dscp-requested"]
records = ["dscp-from-an-allowed-set-never-ect"]

[[mask]]
pdu = "activation-response"
field = "high_speed_delta"
when = ["coerced-parameters"]
records = ["out-of-range-parameters-clamped"]

[[mask]]
pdu = "activation-response"
field = "ignore_ooo_dup"
when = ["coerced-parameters"]
records = ["out-of-range-parameters-clamped"]

[[mask]]
pdu = "activation-response"
field = "low_thresh"
when = ["coerced-parameters"]
records = ["out-of-range-parameters-clamped", "low-thresh-above-upper-lowered"]

[[mask]]
pdu = "activation-response"
field = "sending_rate.burst_size1"
when = ["consumer-key", "start-row-above-100", "upstream"]
records = ["consumer-start-row-capped"]

[[mask]]
pdu = "activation-response"
field = "sending_rate.burst_size1"
