# Load Rate Adjustment Algorithms B and C, Lost Status Backoff, Trial
# Interval classification, Status PDU sequencing and the Sending Rate
# Structure's size convention.

# Algorithms B and C

[[record]]
id = "shallow-queue-search-alternates-at-the-bottleneck"
kind = "interpretation"
summary = "Through a queue too shallow for delay variation to reach upperThresh, Algorithm B confirms Congestion at its first overshoot below the 1 Gbps row: Fast Mode's jump of highSpeedDelta rows past the bottleneck's rate brings slowAdjThresh Errored Intervals back to back, and the third takes 3 × highSpeedDelta rows off, once. From then on, in Single-Step Mode, each Errored Interval takes one row off and each Clean one adds one back, and loss, the only signal such a queue gives, comes back a Trial Interval or two late, so the search settles into a cycle a few rows around the bottleneck's rate and every Sub-Interval loses Load PDUs at the rows above it (5-8 % through 20 ms at 50 Mbit/s with the default seqErrThresh, about 2 % with 0). Above the 1 Gbps row there is no Fast Mode: the search climbs a row at a time, its first overshoot is one row, and it cycles the same way, but its Errored Intervals can come too few at a time to confirm Congestion, which it then never does: through 1 ms of queue at 2.5 Gbit/s, one or two at a time in the simulator, and in network namespaces through tbf two at a time, three in some Tests; through 20 ms, three at a time, which confirms it. The share of the Load PDUs the cycle loses in every Sub-Interval at the bottleneck's rate grows with the row's step against the rate: in the simulator about 2 % at 2.5 Gbit/s through 20 ms over a 10 ms round trip and 3-4 % at 1.2 Gbit/s, growing with the path's delay at the points tested there. Above the 1 Gbps row, where the rows are 100 Mbps apart, it is often above 1 %; below it, from a few hundred Mbit/s up, near 1 %, which the path's delay moves either way. The Client's warning that no search found the path's limit takes a search that never confirmed Congestion as having met it at its end: of its last 64 Trial Intervals, from the first Errored Interval among them on, at least 4 and at least 1 in 4 were errored. udpstp runs the algorithm as specified rather than adding a back-off of its own, and takes RFC 9097 §6.3's maximum over every Sub-Interval that meets the Performance Criterion, the search's climb included; §6.5 doesn't say what a maximum from a Sub-Interval without congestion means in a Test with it. So where no Sub-Interval at the bottleneck's rate meets the criterion, such a Test reports no valid maximum (ErrorStatus 49), or, where a Sub-Interval of the climb met it, at the latest the one in which the search first overshot, a Maximum IP-Layer Capacity from the climb, well below the bottleneck and with no warning: a cliff, not a bias. 1960 Mbit/s of 2.5 Gbit/s through tbf's 20 ms in network namespaces; in the simulator 1885 Mbit/s there, Fast Mode's last Sub-Interval, 893 Mbit/s, at 1 to 2 Gbit/s, and 287 Mbit/s at 500 Mbit/s over a 40 ms round trip, where the cycle loses 1.04 %. Either way it gives the Highest IP-Layer Capacity with its Loss Ratio; `--max-loss-ratio` accepts more loss."
rfc = "RFC 9097 §6.3, §6.5, §8.1"
requirements = ["RFC9097-6.3-L1", "RFC9097-6.3-3", "RFC9097-6.3-4", "RFC9097-8.1-L11"]
obudpst = "OB-UDPST's search takes the same steps (one row each way above the 1 Gbps row, the confirming drop only below it, Sequence Errors counted without reordering and duplicates), so while the queue's delay stays under lowThresh it cycles the same way with the same loss: measured at 50 Mbit/s, and above the 1 Gbps row read from its code. Between lowThresh and upperThresh its Hold Intervals differ, since it judges the RTT variation by default (record delay-var-is-the-maximum-by-default). It reports the Highest IP-Layer Capacity as its maximum whatever the loss (record json-at-max-is-the-maximum), there the bottleneck's rate."
reference = []
tests = [
    "src/tests/protocol/algorithm_b.rs::a_search_through_a_shallow_queue_alternates_around_the_bottleneck",
    "src/tests/protocol/congestion_never_confirmed.rs::a_search_alternating_above_the_gigabit_row_met_the_limit",
    "src/tests/protocol/congestion_never_confirmed.rs::a_search_alternating_near_12_gbit_s_met_the_limit",
    "src/tests/protocol/maximum_through_drop_tail_queues.rs::above_the_gigabit_row_a_20_ms_queue_leaves_the_maximum_on_the_climb",
]

[[record]]
id = "fast-mode-stops-at-the-gigabit-row"
kind = "interpretation"
summary = "Fast Mode never passes the 1 Gbps row (row 1000). Algorithm B adds highSpeedDelta rows but stops at that row; algorithm C jumps to it when doubling would pass it. Above it, the search moves in Single-Step Mode, one row at a time, as a Test already there would. RFC 9097 §8.1's prose says the rate is only increased by one above a high rate such as 1 Gbps; Y.1540 Amd 2 and TR-471's flowcharts, and RFC 9097's example pseudocode, add highSpeedDelta with no cap, so a search just below the 1 Gbps row could overshoot it by up to highSpeedDelta - 1 rows, which above row 1000 are OB-UDPST's much larger jumbo rows. OB-UDPST caps it the same way, so results match."
rfc = "RFC 9097 §8.1; RFC 9946 §5.1"
requirements = ["RFC9946-5.1-7", "RFC9097-8.1-L12"]
reference = ["docs/spec.md"]
tests = [
    "src/tests/protocol/algorithm_b.rs::rows_stay_within_the_table_and_fast_mode_stops_at_1_gbps",
    "src/tests/protocol/algorithm_c.rs::the_jump_to_1_gbps_leaves_update_as_it_was",
]

[[record]]
id = "latched-congestion-confirmed"
kind = "interpretation"
summary = "Congestion is confirmed by slowAdjThresh Errored Intervals back to back: any Clean or Hold Interval resets the count, following RFC 9946 §5.1(5)'s \"in all of the consecutive intervals\". Congestion Confirmed is then latched, so algorithm B never leaves Single-Step Mode (RFC 9946 §7), and algorithm C clears it only in a Fast-Mode Retry. Resetting the flowchart's SlowAdjCount instead would let algorithm B return to Fast Mode and oscillate."
rfc = "RFC 9946 §5.1"
requirements = ["RFC9946-5.1-L1"]
obudpst = "Keeps the flowchart's single SlowAdjCount, reset only by a Fast Mode pass, so errored, hold, errored, hold, errored also confirms Congestion. OB-UDPST can confirm Congestion earlier on paths with intermittent errors, so the two can report different capacities on the same path."
reference = ["ADR 0005"]
tests = [
    "src/tests/protocol/algorithm_b.rs::congestion_is_confirmed_by_back_to_back_errored_intervals",
    "src/tests/protocol/algorithm_b.rs::intermittent_errored_intervals_do_not_confirm_congestion",
    "src/tests/protocol/algorithm_b.rs::algorithm_b_never_leaves_single_step_mode",
]

[[record]]
id = "confirming-drop-below-the-gigabit-row-only"
kind = "interpretation"
summary = "The Errored Interval that confirms Congestion takes 3 × highSpeedDelta rows off, stopping at row 0, only when the row is below the 1 Gbps row, as the flowchart's `rate < HSpeedThresh` and RFC 9097's pseudocode compare it. At or above the 1 Gbps row it takes one row off, like any other Errored Interval. The comparison is on row indexes: row N is N Mbps up to row 1000."
rfc = "RFC 9946 §5.1"
requirements = ["RFC9946-5.1-7"]
reference = []
