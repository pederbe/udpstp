[[record]]
id = "retry-count-counts-actual-single-steps"
kind = "interpretation"
summary = "Only a single step that moves the row counts toward RetryThresh: a Clean Interval at the Test's highest row, or an Errored Interval at row 0, is none, and neither is the confirming drop. A Lost Status Backoff that moves the row one down counts. Y.1540 Amd 2 Table B.3 counts every status report; OB-UDPST counts as we do."
rfc = "RFC 9946 §5.1"
reference = []
tests = [
    "src/tests/protocol/algorithm_c.rs::clean_intervals_at_the_last_row_are_not_steps",
    "src/tests/protocol/algorithm_c.rs::a_confirming_step_above_the_gigabit_row_can_retry",
]

[[record]]
id = "fast-mode-retry-resets-the-errored-run"
kind = "interpretation"
summary = "A Fast-Mode Retry clears Congestion Confirmed and also resets the count of back-to-back Errored Intervals, as the flowchart resets SlowAdjCount. This is a reset beyond ADR 0005's reset by any Clean or Hold Interval: a retry reached on an Errored Interval starts the next run from 0."
