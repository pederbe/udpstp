# Lost Status Backoff

[[record]]
id = "lost-status-backoff-is-an-errored-interval"
kind = "interpretation"
summary = "A Lost Status Backoff counts as an Errored Interval, following RFC 9097 §8.1's \"same process\" with the algorithm's variables \"in their current state\": it adds to the back-to-back run, can confirm Congestion with the one-time drop of 3 × highSpeedDelta rows, and otherwise takes one row off. RFC 9097 describes it for algorithm B only; under algorithm C a backoff that moves the row also counts toward RetryThresh, so a long feedback outage can cycle through confirmation, drop and Fast-Mode Retry. At the defaults the third backoff, about 290 ms without a Status PDU, confirms Congestion."
rfc = "RFC 9097 §8.1"
requirements = ["RFC9097-8.1-13", "RFC9097-8.1-L21"]
obudpst = "Has no Lost Status Backoff: it keeps its rate until its no-traffic timeouts."
reference = ["ADR 0005"]
tests = [
    "src/tests/protocol/lost_status_backoff.rs::a_backoff_counts_as_an_errored_interval",
    "src/tests/protocol/lost_status_backoff.rs::lost_status_pdus_back_the_rate_off_and_confirm_congestion",
    "src/tests/protocol/lost_status_backoff.rs::backoffs_stop_at_row_0_and_two_in_a_row_leave_fast_mode_on",
]

[[record]]
id = "lost-status-backoff-initial-w"
kind = "interpretation"
summary = "RFC 9097 §8.1 lets a path whose RTT is longer than trialInt start w above 0. The Server starts w at the Setup Response's round trip (from sending it to the Activation Request's arrival) divided by trialInt, rounded up, capped so the first Lost Status Backoff still comes before the 1 s Status PDU timeout. Without it a path with an RTT above about 140 ms backs off three times before its first Status PDU can arrive and confirms Congestion at the start. Once a Status PDU arrives, w starts over at 0."
rfc = "RFC 9097 §8.1"
requirements = ["RFC9097-8.1-14", "RFC9097-8.1-L20"]
reference = []
tests = [
    "src/tests/protocol/lost_status_backoff.rs::a_long_path_gets_no_backoff_before_its_first_status_pdu",
    "src/protocol/algorithm.rs::the_initial_w_covers_the_round_trip",
    "src/protocol/algorithm.rs::the_initial_w_keeps_the_first_backoff_before_the_status_pdu_timeout",
]

# Status PDU sequencing

[[record]]
id = "stale-status-pdus-count-only-as-heard"
kind = "interpretation"
summary = "A Status PDU whose spduSeqNo isn't greater than the last one processed, or is 0, is stale, in both roles: it isn't fed to the Load Rate Adjustment Algorithm, can't change the Sending Rate Structure or deliver STOP, and isn't echoed for RTT. It still counts as heard for the Watchdog and Lost Status Backoff, its Sub-Interval statistics still count, and it is counted (DataEvent::StaleStatusPdus). RFC 9097 runs the algorithm on each \"new status report\" without saying whether a reordered or duplicated one is new; this rule keeps a replayed Status PDU from steering or stopping a Test."
rfc = "RFC 9946 §8.2"
requirements = ["RFC9946-8.2-4", "RFC9946-8.2-L2"]
obudpst = "Feeds every Status PDU, reordered or duplicated ones included, to the algorithm in a Downstream Test."
reference = ["docs/spec.md story 92"]
tests = [
    "src/tests/protocol/stale_status_pdus.rs::a_stale_status_pdu_does_not_steer_the_server",
    "src/tests/protocol/stale_status_pdus.rs::a_stale_status_pdu_does_not_steer_the_client",
    "src/tests/protocol/stale_status_pdus.rs::a_stale_stop_does_not_end_the_test",
    "src/tests/protocol/stale_status_pdus.rs::a_stale_status_pdu_still_counts_as_heard",
]

[[record]]
id = "spdu-seq-err-is-the-gap-before-the-latest"
kind = "interpretation"
summary = "The Load Sender's spduSeqErr is the number of Status PDUs missing just before the latest one processed, not a running total, as OB-UDPST counts it; a gap above 0xFFFE is sent as 0xFFFE. RFC 9946 §8.1 calls it \"the Status PDU loss count\" without saying over what span."
rfc = "RFC 9946 §8.1"
requirements = ["RFC9946-8.1-L8"]
obudpst = "Sends 0xFFFF for a reordered Status PDU; udpstp treats that one as stale and never sends 0xFFFF."
reference = []
tests = [
    "src/tests/protocol/stale_status_pdus.rs::spdu_seq_err_reports_the_status_pdus_missing_before_the_latest",
    "src/tests/protocol/status_loss.rs::a_load_sender_counts_the_status_pdus_it_never_received",
]

# Trial Interval classification

[[record]]
id = "delay-var-is-the-maximum-by-default"
kind = "obudpst-difference"
summary = "With useOwDelVar True, a Trial Interval's DelayVar is its maximum one-way delay variation (delayVarMax), the \"delay range\" RFC 9946 §5.1(6) and RFC 9097 §8.1 judge. A Server setting makes it the average, delayVarSum / delayVarCnt rounded half up, as OB-UDPST uses. With useOwDelVar False it is the Status PDU's rttVarSample, as in OB-UDPST."
rfc = "RFC 9946 §5.1; RFC 9097 §8.1"
obudpst = "Classifies by the rounded average one-way delay variation, which is lower than the maximum, so an OB-UDPST Server sees fewer Errored Intervals and can search higher on a jittery path."
default = "on"
setting = "`--delay-var-statistic`, `delay_var_statistic` in TOML"
reference = []
tests = [
    "src/tests/protocol/interval_classification.rs::the_maximum_is_the_default_and_the_average_a_setting",
    "src/tests/protocol/interval_classification.rs::the_average_rounds_and_clean_is_strictly_below_the_low_threshold",
    "src/tests/protocol/interval_classification.rs::without_one_way_delay_the_latest_rtt_sample_is_delay_var",
]

[[record]]
id = "clean-needs-delay-var-below-low-thresh"
kind = "interpretation"
summary = "A Clean Interval needs DelayVar strictly below lowThresh, as RFC 9097's pseudocode and OB-UDPST have it; the Y.1540 and TR-471 flowcharts say `<=`. A DelayVar equal to lowThresh makes a Hold Interval."
rfc = "RFC 9946 §5.1"
requirements = ["RFC9946-5.1-9"]
reference = []
tests = ["src/tests/protocol/interval_classification.rs::the_average_rounds_and_clean_is_strictly_below_the_low_threshold"]

[[record]]
id = "seq-err-thresh-always-applied"
kind = "interpretation"
summary = "RFC 9946 §5.1(6) says Congestion MUST be indicated when Sequence Errors are detected, then recommends a threshold of 10. udpstp always applies seqErrThresh: a Trial Interval is errored only when its Sequence Errors exceed it, and 0 is honoured, so any Sequence Error is errored then. The flowcharts, RFC 9097's pseudocode and OB-UDPST do the same."
rfc = "RFC 9946 §5.1"
requirements = ["RFC9946-5.1-9"]
reference = []
tests = ["src/tests/protocol/interval_classification.rs::seq_err_thresh_is_always_applied"]

[[record]]
id = "no-delay-sample-is-never-clean"
kind = "interpretation"
summary = "A Trial Interval without a delay sample is never clean: it is a Hold Interval unless its Sequence Errors exceed seqErrThresh. A Trial Interval in which no Load PDU arrived is one too, since its loss shows only once a later Load PDU arrives. The documents don't cover the case; OB-UDPST also treats it as no change."
rfc = "RFC 9946 §5.1"
requirements = ["RFC9946-5.1-9"]
reference = []
tests = ["src/tests/protocol/interval_classification.rs::no_delay_samples_is_never_clean"]

[[record]]
id = "stop-status-pdus-are-not-classified"
kind = "interpretation"
summary = "A Status PDU whose testAction is STOP is not classified and doesn't move the rate: it ends the Test rather than reporting a Trial Interval to adjust on. This holds for the Status PDUs the Server receives in a Downstream Test and those it sends in an Upstream Test. Once the Server has sent STOP1 it classifies none, even those still marked TEST: the Test is ending, so the rate no longer matters. Everything else about the PDUs received then is processed normally (RFC 9946 §9): they count in the results, reset the Watchdog, and give sequence numbers and RTT samples."
rfc = "RFC 9946 §8.2, §9"
requirements = ["RFC9946-9-L2"]
reference = []
tests = [
    "src/tests/protocol/interval_classification.rs::a_stop_status_pdu_is_not_classified",
    "src/tests/protocol/interval_classification.rs::an_upstream_server_classifies_the_status_pdus_it_sends",
    "src/tests/protocol/stop_exchange.rs::load_pdus_arriving_after_stop1_still_count",
]

# Sending Rate Structure sizes

[[record]]
id = "ipv4-based-sending-rate-structure-sizes"
kind = "interpretation"
summary = "The payload sizes in the Sending Rate Structure are IPv4-based (IP packet size minus 28 bytes), and a Load Sender on IPv6 sends each datagram 20 bytes smaller, unless that would leave less than a Load PDU header, so packet sizes and rates are the same on both address families. This reconciles RFC 9946 §8.1's \"use the parameters unchanged\" with §6.1's maximum IP packet sizes, which a literal reading breaks on IPv6. The IP version comes from each Test Connection's packets, never the socket family: an IPv4-mapped peer is IPv4. OB-UDPST uses the same convention, and our Client can't tell an OB-UDPST Server from another, so both roles always apply it."
rfc = "RFC 9946 §6.1, §8.1"
requirements = ["RFC9946-6.1-8", "RFC9946-6.1-9", "RFC9946-6.1-11", "RFC9946-6.1-12", "RFC9946-7.1-5", "RFC9946-8.1-1", "RFC9946-8.1-6"]
reference = ["ADR 0004"]
tests = [
    "src/tests/protocol/upstream.rs::an_ipv6_client_sends_20_bytes_less",
    "src/tests/protocol/upstream.rs::an_ipv6_client_draws_random_sizes_from_32",
    "src/tests/protocol/sending_rate_table.rs::every_row_up_to_1_gbps_fits_the_rfc_sizes_and_ob_udpst_client_limits",
]

[[record]]
id = "rate-changes-when-a-status-pdu-arrives"
kind = "deviation"
deviation = "unmet-should"
summary = "The Load Sender changes its rate when a Status PDU arrives, as the algorithm decides, not at the next boundary of its own st: the Load Receiver's Trial Intervals, which the Status PDUs close, and the Load Sender's st are the same length but offset by the one-way delay. So one st can carry two rates, and its IP-Layer Sender Bit Rate is their mix."
rfc = "RFC 9097 §7.3"
requirements = ["RFC9097-7.3-4"]
obudpst = "OB-UDPST changes the rate when a Status PDU arrives too."
default = "on"
revisit = "If per-st Sender Bit Rates were reported (sender-bit-rate-per-sub-interval) and a clean rate per st mattered: defer each change to the next st boundary."
reference = []
tests = ["src/tests/protocol/algorithm_b.rs::in_fast_mode_each_clean_interval_adds_high_speed_delta_rows"]
