# The Server's Control Phase and admission: Setup and Activation handling,
# authentication and troubleshooting, the replay cache, budgets and Test
# limits, the Activation parameters and the Sending Rate Table's shape.
# Format: xtask/src/records.rs.

# Authentication and unauthenticated mode

[[record]]
id = "unauthenticated-mode"
kind = "deviation"
deviation = "non-conformance"
summary = "A Server may serve unauthenticated Tests (authMode 0), and a Client may ask for one, only when each opts in. Such a Test has no authentication and no replay protection: requests in Unauthenticated Mode carry no digest, so they bypass the replay cache, and they spend no per-Source budget."
rfc = "RFC 9946 §5.3, §6.1"
requirements = ["RFC9946-6.1-L11", "RFC9946-5.3-1"]
obudpst = "OB-UDPST runs unauthenticated whenever the Server has no keys and the Client sends authMode 0, with no opt-in."
default = "off"
setting = "`--allow-unauthenticated`, `allow_unauthenticated` in TOML (Server); `--unauthenticated` (Client)"
revisit = "If the interop matrix no longer needs Unauthenticated Mode against OB-UDPST, or a lab use for it disappears."
reference = []
tests = [
  "src/tests/protocol/setup_exchange.rs::unauthenticated_setup_ends_in_ack_with_a_test_port_when_both_ends_opt_in",
  "src/tests/protocol/setup_exchange.rs::server_without_opt_in_does_not_accept_an_unauthenticated_setup",
  "src/tests/protocol/replay_cache.rs::unauthenticated_requests_bypass_the_cache",
]

[[record]]
id = "auth-time-window-inclusive-modulo-2-32"
kind = "interpretation"
summary = "A received authUnixTime is acceptable within 5 s of the receiver's wall clock, in whole seconds, both edges included. The difference is taken modulo 2^32 as a signed 32-bit value, so times either side of the field's 2106 wraparound compare correctly."
rfc = "RFC 9946 §5.3.1"
requirements = ["RFC9946-5.3.1-4"]
obudpst = "OB-UDPST compares 64-bit times and would reject every PDU after the 2106 wraparound."
reference = ["ADR 0009"]
tests = [
  "src/tests/protocol/setup_mode1.rs::clocks_five_seconds_apart_are_within_the_window",
  "src/tests/protocol/setup_mode1.rs::server_silently_drops_a_setup_more_than_five_seconds_off",
  "src/tests/protocol/setup_mode1.rs::setup_is_accepted_across_the_2106_wraparound",
  "src/tests/protocol/activation_mode1.rs::server_accepts_an_activation_time_5_s_off",
]

[[record]]
id = "authentic-setup-outside-time-window-is-silent"
kind = "interpretation"
summary = "A Setup Request whose digest verifies but whose authUnixTime is outside the window is dropped silently. The §6.2 note makes it invalid, which comes before §6.2.1's rule that a valid authDigest gets a coded rejection. Only Troubleshooting Mode answers it, with AUTHTIME."
rfc = "RFC 9946 §6.2, §6.2.1"
requirements = ["RFC9946-6.2-2", "RFC9946-6.2.1-3"]
obudpst = "OB-UDPST always answers with CHSR_CRSP_AUTHTIME."
reference = ["ADR 0009"]
tests = ["src/tests/protocol/setup_rejections.rs::an_authentic_request_outside_the_time_window_gets_no_response"]

[[record]]
id = "activation-auth-matches-setup"
kind = "interpretation"
summary = "An Activation Request must carry its Setup Request's authMode and keyId, checked before the digest as part of \"authMode ... appropriate\" (§6.2 step 3); a mismatch is dropped silently like any other verification failure."
rfc = "RFC 9946 §5.4.1, §6.2, §7.2.1"
requirements = ["RFC9946-7.2-2", "RFC9946-7.2.1-6", "RFC9946-5.4.1-8"]
obudpst = "OB-UDPST doesn't check the Activation Request's keyId; its Client always sends the Setup's."
reference = ["ADR 0009"]
tests = ["src/tests/protocol/activation_mode1.rs::server_silently_drops_activations_that_fail_verification"]

[[record]]
id = "silent-authentication-failures"
kind = "obudpst-difference"
summary = "Every Setup Request that fails authentication is dropped silently (bad digest, unknown keyId, key outside its lifetime, time outside the window, unsupported or missing authMode, no keys configured), as the RFC's default; only Troubleshooting Mode answers."
obudpst = "OB-UDPST always answers these failures with a coded Setup Response (AUTHFAIL, AUTHTIME, AUTHNC, AUTHREQ, AUTHINV) and has no silent mode."
