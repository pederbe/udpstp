[[record]]
id = "table-steps-above-1-gbps"
kind = "deviation"
deviation = "unmet-should"
summary = "Above the 1 Gbps row the Sending Rate Table follows OB-UDPST's rows, so a search runs alike against either. Its steps are 100 Mbps to 10 Gbps with the default 1250-byte packets, as recommended, but 120 Mbps with Traditional MTU's 1500-byte packets, and with Jumbo 100 Mbps only to 7.2 Gbps, then 720 Mbps (one more 9000-byte packet a Burst) to 72 Gbps, not 1 Gbps above 10 Gbps."
rfc = "RFC 9097 §8.1"
requirements = ["RFC9097-8.1-4", "RFC9097-8.1-5"]
obudpst = "OB-UDPST's table has the same rows."
default = "on"
revisit = "If matching OB-UDPST's table stopped mattering, or searches above 7.2 Gbps needed finer steps than 720 Mbps."
reference = []
