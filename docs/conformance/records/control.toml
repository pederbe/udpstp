[[record]]
id = "row-zero-fixed-size"
kind = "obudpst-difference"
summary = "Row 0 sends one 625-byte IP packet every 50 ms on the second transmitter: 0.1 Mbps, always the same size. The RFC gives row 0 no meaning beyond the first row."
obudpst = "OB-UDPST's row 0 sends one add-on every 50 ms of random size, up to 1222 bytes of payload (1472 with -T), with the random-size bit set in udpAddon2: about 0.11 Mbps."
reference = []
tests = ["src/tests/protocol/sending_rate_table.rs::row_zero_sends_fixed_size_datagrams_near_0_1_mbps"]
masks = [
  { pdu = "activation-response", fields = ["sending_rate.udp_addon2"], when = ["upstream", "default-search"] },
]

[[record]]
id = "authentic-setup-requests-left-unanswered"
kind = "deviation"
deviation = "non-conformance"
summary = "Some Setup Requests with a valid authDigest that are refused get no Test Setup Response: beyond a Source's budget, all but the first refusal since the Source last spent a token; a copy of an admitted Setup Request (same address, mcIdent and mcIndex), which the network may have duplicated; and a new request while the replay cache is full. Answering each would let a key holder make the Server reflect a signed response per datagram, and a duplicate's refusal would end the Test it belongs to."
rfc = "RFC 9946 §6.2.1"
requirements = ["RFC9946-6.2.1-3"]
obudpst = "OB-UDPST answers every refused Setup Request; it has no per-Source budget or replay cache, and refuses a duplicate as a Test Connection it already has."
default = "on"
revisit = "If a rate limit on signed rejections made answering every refused request safe, or a Client were seen to hang on a refusal it was never sent."
reference = ["docs/spec.md"]
tests = [
  "src/tests/protocol/source_budget.rs::only_the_first_refusal_is_answered",
  "src/tests/protocol/multi_connection_checks.rs::a_duplicated_setup_request_is_answered_once",
  "src/protocol/replay.rs::a_full_cache_refuses_new_requests_until_entries_expire",
]

[[record]]
id = "operator-keys-exempt-from-500-ms-congestion-inference"
kind = "deviation"
deviation = "non-conformance"
summary = "A Test with an Operator Key keeps the slowAdjThresh and trialInt it asked for, even when inferring Congestion then takes longer than the 500 ms RFC 9946 §5.1 item 5 sets as its maximum. An Operator configures the measurement, for example to study slow paths."
rfc = "RFC 9946 §5.1"
requirements = ["RFC9946-5.1-8"]
obudpst = "OB-UDPST applies no 500 ms limit to anyone."
default = "on"
revisit = "If no Operator needs Congestion inferred more slowly, or RFC 9946 §5.1's limit is clarified as applying to consumer Tests only."
reference = ["docs/spec.md"]
tests = ["src/tests/protocol/test_interval_limits.rs::slow_adj_thresh_times_trial_int_is_at_most_500_ms"]

[[record]]
id = "no-frequency-or-volume-quotas"
kind = "deviation"
deviation = "unmet-should"
summary = "Quotas are off by default: unless the administrator sets one, the Server doesn't limit how often, or how much, one Client tests, only how much runs at once (Tests per Source, Test Connections, the Admitted Rate Cap) and how long a Consumer's Test Interval is (60 s), which is RFC 9946's own example. Set, a Source's or a Key Table row's Quota of Tests and load bytes per Quota Period refills evenly; a new Test past it is refused with CONNFAIL at Setup, or with BADPARAM when it first activates after Tests set up alongside it used the Quota first. Operator Keys are exempt. Use is counted in memory, so a restart forgets it; a per-Source Quota treats everyone behind one carrier-grade NAT address as one Source, and an IPv6 Client can move between /64s."
rfc = "RFC 9946 §11"
requirements = ["RFC9946-11-6"]
obudpst = "OB-UDPST has no such quotas."
default = "on"
setting = "`--quota-period`, `--source-tests-per-quota-period`, `--source-bytes-per-quota-period`; `tests_per_quota_period` and `bytes_per_quota_period` on a key table row"
revisit = "If a deployment serves Consumers whose data volumes are limited, set Quotas there; revisit the default if RFC 9946 §11 item 6 is read as requiring them on."
reference = ["docs/spec.md"]
tests = [
  "src/tests/protocol/quotas.rs::a_source_past_its_quota_of_tests_is_refused_with_connfail",
  "src/tests/protocol/quotas.rs::a_source_past_its_quota_of_bytes_is_refused",
  "src/protocol/admission.rs::the_quota_refills_over_the_quota_period",
  "src/tests/protocol/quotas.rs::tests_set_up_together_past_the_quota_are_refused_at_activation",
  "src/tests/protocol/quotas.rs::a_key_past_its_quota_is_refused",
  "src/protocol/admission.rs::operator_keys_are_exempt",
  "src/protocol/admission.rs::a_test_lives_on_in_a_test_connection_waiting_for_its_socket",
]

