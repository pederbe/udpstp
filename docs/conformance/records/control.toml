]

[[record]]
id = "usdir-must-match-activation-direction"
kind = "interpretation"
summary = "With an Admitted Rate Cap set, an Activation Request whose direction differs from its Setup Request's CHSR_USDIR_BIT is refused with BADPARAM, since bandwidth admitted for one direction can't be used in the other. Only when the Setup stated a nonzero maxBandwidth: OB-UDPST's Client sets the bit only then. Without a cap the bit decides nothing."
rfc = "RFC 9946 §6.1, §7.2.1"
requirements = ["RFC9946-6.1-L8"]
reference = []
