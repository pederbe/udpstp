]

[[record]]
id = "admitted-rate-reserved-at-activation"
kind = "interpretation"
summary = "Only activated Tests hold the Admitted Rate Cap: a Test reserves its whole stated rate, in each direction its Test Connections state, when its first Test Connection activates, so a Setup never activated can't keep other Tests out of the cap. From then on each of its admitted Test Connections holds its rate, one still waiting for its socket included. Of Tests admitted together past the cap, one that no longer fits when it activates is refused whole with BADPARAM, never left half running."
rfc = "RFC 9946 §6.1, §11"
requirements = ["RFC9946-11-4"]
obudpst = "OB-UDPST reserves the rate at Setup."
reference = []
tests = [
  "src/protocol/admission.rs::an_unactivated_setup_holds_no_rate",
  "src/tests/protocol/admission_limits.rs::of_two_setups_racing_past_the_cap_the_first_activated_keeps_it",
