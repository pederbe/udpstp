# Setup Request checks and rejection codes

[[record]]
id = "legacy-protocol-versions-get-badver"
kind = "obudpst-difference"
summary = "Any protocolVer other than 20 is rejected with BADVER, legacy versions 11 to 19 included; the response carries protocolVer 20."
obudpst = "OB-UDPST also serves protocolVer 11 to 19."
reference = []
tests = [
  "src/tests/protocol/setup_rejections.rs::a_bad_protocol_version_is_rejected_with_the_expected_version",
  "src/tests/protocol/setup_rejections.rs::an_unauthenticated_request_gets_unsigned_rejections",
]

[[record]]
id = "setup-check-order"
kind = "obudpst-difference"
summary = "The Server checks a Setup Request in the RFC's order: size, checksum, authentication, then the replay cache, the Source's budget and the Key Table row's budget, then the other fields: BADVER, BADJS, BADTMTU. Then Admission's limits: a copy of an admitted request is ignored; the Multi-Connection fields (MCINVPAR); for a new Test, the Tests per Source, then the Quota (CONNFAIL); a missing maxBandwidth (NOMAXBW); the per-Test cap, then the global cap (CONNFAIL); the Admitted Rate Cap and one Test's share of it (CAPEXC)."
obudpst = "OB-UDPST judges the fields before authMode, and checks MCINVPAR right after BADVER, before BADJS and BADTMTU; so an unauthenticated request learns the field results before being told authentication is required."
reference = []
tests = [
  "src/tests/protocol/setup_rejections.rs::a_disallowed_unauthenticated_request_is_silent_whatever_its_options",
  "src/tests/protocol/setup_rejections.rs::the_options_are_judged_before_the_multi_connection_fields",
  "src/protocol/admission.rs::a_setup_is_refused_by_the_first_check_it_fails",
]

[[record]]
id = "server-limits-refuse-with-connfail"
kind = "interpretation"
summary = "The Server's own limits are refused with CHSR_CRSP_CONNFAIL: Tests per source, Test Connections per Test (24 by default) and in all, a Source's budget, and a socket that can't be opened. So an mcCount above 24 isn't refused with MCINVPAR; the 25th Test Connection gets CONNFAIL. The Admitted Rate Cap and one Test's share of it give CAPEXC. Every Activation refusal is CHTA_CRSP_BADPARAM, the only code §12.3.9 defines."
rfc = "RFC 9946 §6.2.1, §7.2.1, §12.3.5"
requirements = ["RFC9946-6.2.1-3", "RFC9946-7.2.1-L2", "RFC9946-12.3.5-L1"]
obudpst = "OB-UDPST refuses an mcCount above 24 with MCINVPAR, and sends CONNFAIL only when its connection table is full or allocation fails."
reference = []
tests = [
  "src/tests/protocol/admission_limits.rs::a_test_connection_over_the_per_test_cap_is_refused_with_connfail",
  "src/tests/protocol/admission_limits.rs::the_per_test_cap_is_24_by_default",
  "src/tests/protocol/admission_limits.rs::a_test_connection_over_the_global_cap_is_refused_with_connfail",
  "src/tests/protocol/admission_limits.rs::a_setup_whose_socket_cant_be_opened_is_refused_and_released",
  "src/tests/protocol/source_budget.rs::a_request_over_its_sources_budget_gets_a_signed_connfail",
]

[[record]]
id = "per-test-cap-over-the-tests-life"
kind = "interpretation"
summary = "The Test Connections per Test cap counts over the Test's whole life, closed ones included, so a Test kept alive by one Test Connection can't start new measurements under it. A Test ends when none of its Test Connections is admitted any more, one waiting for its socket included; a Setup from the same address and mcIdent after that starts a new Test."
rfc = "RFC 9946 §11"
requirements = ["RFC9946-11-4"]
reference = []
tests = [
  "src/protocol/admission.rs::a_test_kept_alive_cannot_start_new_test_connections_past_its_cap",
  "src/protocol/admission.rs::a_test_waiting_on_one_test_connection_keeps_its_closed_count",
]

[[record]]
id = "multi-connection-agreement-checks"
kind = "interpretation"
summary = "The Test Connections of a Test (one Client address and mcIdent) must agree: mcIdent non-zero, mcIndex below mcCount and unique within the Test, the same mcCount and authMode, and the same keyId in an authenticated mode; otherwise MCINVPAR. This is stricter than §4, which lets a Server treat each Test Connection as if from a separate Client; §6.1 lets a Server use mcIdent to associate them. The Test's other mcIndexes are never waited for."
rfc = "RFC 9946 §4, §6.1"
requirements = ["RFC9946-6.1-L1", "RFC9946-6.1-L3", "RFC9946-4-L2"]
obudpst = "OB-UDPST checks only mcCount at most 24 and mcIndex below mcCount, keeps no per-mcIdent state, and accepts mcIdent 0."
reference = []
tests = [
  "src/tests/protocol/multi_connection_checks.rs::a_zero_mc_ident_is_refused",
  "src/protocol/admission.rs::an_mc_index_not_below_mc_count_is_refused",
  "src/tests/protocol/multi_connection_checks.rs::an_mc_index_already_in_use_in_the_test_is_refused",
  "src/protocol/admission.rs::a_test_connection_with_another_mc_count_is_refused",
