# Replay cache and budgets

[[record]]
id = "replay-cache-for-setup-requests"
kind = "interpretation"
summary = "The replay cache remembers a verified Setup Request's keyId and authDigest, only once it has passed the digest and time checks and is within its Source's budget, so a flood can't fill it faster than the budgets allow; a copy of one refused by its budget is judged afresh once the budget refills. A copy is dropped silently. Two Clients sharing a key that send byte-identical requests (same mcIdent, parameters and second) collide: the second is dropped as a replay."
rfc = "RFC 9946 §5.3.1"
requirements = ["RFC9946-5.3.1-4"]
obudpst = "OB-UDPST has no replay cache."
reference = []
tests = [
  "src/tests/protocol/replay_cache.rs::a_replayed_setup_request_is_dropped",
  "src/tests/protocol/replay_cache.rs::a_setup_request_replayed_after_its_test_connection_ended_is_dropped",
  "src/tests/protocol/replay_cache.rs::a_request_refused_by_its_sources_budget_isnt_remembered",
  "src/tests/protocol/setup_rejections.rs::a_replayed_rejected_request_gets_one_response",
]

[[record]]
id = "replay-cache-activation-keyed-on-sender"
kind = "interpretation"
summary = "Activation Requests are remembered by keyId, authDigest and sender address: the Test Connections of a Multi-Connection Test set up in the same second send byte-identical Activation Requests. One cache serves every socket, and an Activation Request must come from its Setup's Client IP address, so a verbatim copy sent to a sibling's Ephemeral Port is caught; a copy spoofed from another port of that address isn't."
rfc = "RFC 9946 §5.3.1"
requirements = ["RFC9946-5.3.1-4"]
obudpst = "OB-UDPST has no replay cache."
reference = []
tests = [
  "src/tests/protocol/replay_cache.rs::a_replayed_activation_request_is_dropped_at_a_sibling_test_connection",
  "src/tests/protocol/replay_cache.rs::an_activation_request_from_another_ip_address_is_dropped",
]

[[record]]
id = "replay-cache-lifetime-and-capacity"
kind = "interpretation"
summary = "An entry lives 11 s on the monotonic clock: 5 s after an authUnixTime stamped up to 5 s ahead, plus the truncated second. A wall-clock step back of 5 s or more can let an expired request in again. The cache is sized from the global budget (every Setup Request it lets through in 11 s, plus four Activation Requests per Test Connection; 220k entries by default, at most about 2 million) and refuses new verified requests while full."
rfc = "RFC 9946 §5.3.1"
requirements = ["RFC9946-5.3.1-4"]
reference = []
tests = [
  "src/protocol/replay.rs::an_entry_lasts_11_s",
  "src/protocol/replay.rs::a_full_cache_refuses_new_requests_until_entries_expire",
  "src/protocol/replay.rs::the_capacity_covers_what_the_budgets_let_through",
]

[[record]]
id = "unverified-setup-budget"
kind = "interpretation"
summary = "A global budget, 20000 a second by default, caps the Setup Requests that reach a KDF run and an HMAC; the rest are dropped silently. It is spent once a Key Table row is found, so unknown keyIds and keys outside their lifetimes are dropped first without spending it, and by every allowed request in Unauthenticated Mode. Activation Requests draw on no budget. It is a fixed one-second window, which admits Setup Requests that arrive together, such as a Multi-Connection Test's, all together while it has room."
rfc = "RFC 9946 §11"
default = "on"
setting = "`--unverified-setups-per-second`, `unverified_setups_per_second` in TOML"
reference = []
tests = [
  "src/tests/protocol/unverified_budget.rs::setup_requests_beyond_the_budget_are_dropped_silently",
  "src/tests/protocol/unverified_budget.rs::the_budget_is_20000_a_second_by_default",
  "src/tests/protocol/unverified_budget.rs::setup_requests_that_arrive_together_pass_or_fail_together",
  "src/tests/protocol/unverified_budget.rs::a_request_with_an_unknown_key_id_doesnt_spend_the_budget",
  "src/tests/protocol/unverified_budget.rs::an_unauthenticated_request_spends_the_budget",
]

[[record]]
id = "source-budget-spent-after-the-hmac"
kind = "interpretation"
summary = "Each Source (an IPv4 address or IPv6 /64) has a budget of authentic Setup Requests, 48 at once and 5 more a second by default, spent only after the digest verifies, so a spoofed source can't spend another's. A key holder still can, by signing requests from its address. Requests in Unauthenticated Mode have no HMAC and spend none. Beyond the budget, only the first refusal is answered (conformance: authentic-setup-requests-left-unanswered)."
rfc = "RFC 9946 §11"
default = "on"
setting = "`--source-setup-burst`, `--source-setups-per-second`"
reference = []
tests = [
  "src/tests/protocol/source_budget.rs::requests_that_fail_the_hmac_dont_spend_the_budget",
  "src/tests/protocol/source_budget.rs::a_whole_multi_connection_test_fits_the_default_burst",
  "src/tests/protocol/source_budget.rs::unauthenticated_requests_dont_spend_the_budget",
  "src/tests/protocol/source_budget.rs::only_the_first_refusal_is_answered",
]

[[record]]
id = "key-setup-budget"
kind = "interpretation"
summary = "Each Key Table row has a budget of Setup Requests, 1000 at once and 1000 more a second by default, Unauthenticated Mode counting as one row. Operator Keys spend it too. It is spent after the digest verifies and the replay check, so a spoofed request spends none, and a replayed one at most once (a request the budget refused isn't remembered, so a captured copy can come back once), and a request over it is dropped silently, never answered, unlike the per-Source budget's first refusal, so a key holder's flood gets no reflection. A key holder's flood of authentic Setup Requests then costs the Server at most its key's budget in admissions a second, and the rest what a forged request within the unverified budget costs (a KDF run and an HMAC, no admission), so it can't saturate the control thread and, through the Server's shared queue, keep other keys' Clients from starting Tests. The flooding key's own Clients share its budget: a trust-model limit (docs/security.md)."
rfc = "RFC 9946 §11"
obudpst = "OB-UDPST has no per-key budget."
default = "on"
setting = "`--key-setup-burst`, `--key-setups-per-second`"
reference = []
tests = [
  "src/tests/protocol/key_budget.rs::a_keys_setup_requests_over_its_budget_are_dropped_silently",
  "src/tests/protocol/key_budget.rs::an_operator_keys_setup_requests_spend_its_budget_too",
  "src/tests/protocol/key_budget.rs::a_flood_on_one_key_leaves_another_keys_budget_alone",
  "src/tests/protocol/key_budget.rs::unauthenticated_setup_requests_share_one_budget",
  "src/tests/protocol/key_budget.rs::a_replayed_setup_request_spends_no_keys_budget",
]

# Test limits and admission

[[record]]
id = "path-approximated-by-source"
kind = "interpretation"
summary = "The path of §4.2's one concurrent Test per path is approximated by the source: an IPv4 address, or an IPv6 /64 (IPv4-mapped addresses count as IPv4), so link-local and Teredo Clients may share one. A Test is the Client's IP address plus mcIdent. Only activated Tests count, so a spoofed Setup Request can't keep a source from testing; the first Test Connection to activate checks again, and a Test that no longer fits is refused with BADPARAM."
rfc = "RFC 9946 §4.2"
requirements = ["RFC9946-4.2-1"]
obudpst = "OB-UDPST has no per-source or per-path limit."
reference = []
tests = [
  "src/tests/protocol/tests_per_source.rs::a_second_test_from_the_same_source_is_refused_at_setup",
  "src/tests/protocol/tests_per_source.rs::of_two_tests_set_up_together_the_second_is_refused_at_activation",
  "src/protocol/admission.rs::the_test_connections_of_one_test_are_one_test",
  "src/protocol/admission.rs::only_activated_tests_count_against_their_source",
  "src/protocol/admission.rs::a_source_is_an_ipv4_address_or_an_ipv6_64",
]

[[record]]
id = "tests-per-source-above-one"
