[[record]]
id = "unactivated-test-connection-share"
kind = "interpretation"
summary = "Unactivated Test Connections have a separate share outside the global Test Connection cap: half that cap by default, at least the per-Test cap, and configurable above the global cap. The Ephemeral Port range must hold their sum. Activated Tests alone reserve global places, including admitted siblings awaiting their socket or activation. The first activation reserves the whole Test; if it no longer fits, BADPARAM (TestConnections in the log) refuses it and its remaining siblings until all close. The global cap is checked at Setup too, against reserved places, so a full cap still refuses without evicting an unrelated unactivated Test. When the unactivated share is full, a Setup that would otherwise be admitted closes one Unactivated Test Connection (Event::UnactivatedTestConnectionEvicted), as a SYN cache evicts, rather than being refused, so Setup Requests never activated can't fill the global cap. It closes the oldest, by its Setup Response, of the Key Table row holding the most Unactivated Test Connections, those of Unauthenticated Mode counting as one group; of groups holding as many, the one whose oldest is oldest, so with one group the oldest of all. Setups still waiting for their socket count toward the share and their group but aren't closed, so a group holding the most only in those closes no one's and the new Setup is refused, keeping the share bounded. A key flooding authentic Setup Requests that never activate therefore evicts its own, and another key's Client, a Multi-Connection Test's Test Connections included, keeps its place until it activates, at any round trip within the Activation Watchdog, while that key holds fewer than half the share; the oldest of all would let such a flood admitted at R a second close any Client's about 128/R seconds after it was admitted (at the default share). It is a fair share, not a guarantee: a flood split over k groups holds the share in about k + 1 equal parts, so another key holding more than about share/(k + 1) at once loses some. The flooding key's own Clients, and in Unauthenticated Mode every unauthenticated Client, are not protected: a trust-model limit (docs/security.md). RFC 9946 says which Test Connection to close no more than it says to close one."
rfc = "RFC 9946 §11"
requirements = ["RFC9946-11-4"]
obudpst = "OB-UDPST has no such share; unactivated Test Connections hold their slot until the 3 s watchdog."
default = "on"
setting = "`--max-unactivated-test-connections`, `max_unactivated_test_connections` in TOML"
reference = []
tests = [
  "src/tests/protocol/unactivated_share.rs::a_new_setup_evicts_the_oldest_unactivated_test_connection",
  "src/protocol/admission.rs::activated_test_connections_dont_count",
  "src/protocol/admission.rs::a_whole_multi_connection_test_fits_the_share",
  "src/protocol/admission.rs::a_setup_refused_anyway_evicts_no_one",
  "src/protocol/admission.rs::a_setup_the_rate_cap_refuses_evicts_no_one_from_a_full_cap",
  "src/protocol/admission.rs::a_flooding_key_evicts_its_own_unactivated_test_connections",
  "src/protocol/admission.rs::a_busy_server_still_evicts_a_flooding_keys_unactivated_test_connections",
  "src/protocol/admission.rs::a_test_that_no_longer_fits_cannot_activate_a_remaining_sibling",
  "src/protocol/admission.rs::the_first_activation_reserves_siblings_waiting_for_their_sockets",
  "src/protocol/admission.rs::the_unactivated_share_can_exceed_the_global_cap",
  "src/tests/protocol/admission_limits.rs::of_two_setups_racing_for_one_place_only_one_activates",
  "tests/cli.rs::a_ephemeral_port_range_smaller_than_the_cap_plus_share_is_a_configuration_error",
  "tests/cli.rs::the_port_range_accounts_for_configured_and_default_shares_without_overflow",
  "src/protocol/admission.rs::unauthenticated_test_connections_are_one_group",
  "src/protocol/admission.rs::a_multi_connection_test_survives_another_keys_flood",
  "src/protocol/admission.rs::of_two_groups_holding_as_many_the_older_gives_up_its_oldest",
  "src/protocol/admission.rs::a_group_holding_the_most_only_in_waiting_setups_evicts_no_one_else",
  "src/tests/protocol/unactivated_share.rs::another_keys_flood_cannot_evict_a_clients_unactivated_test_connection",
  "src/tests/protocol/unactivated_share.rs::an_unauthenticated_flood_cannot_evict_a_keyed_clients_unactivated_test_connection",
  "src/tests/protocol/unactivated_share.rs::a_flood_on_the_clients_own_key_still_evicts_it",
]

