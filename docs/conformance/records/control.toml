[[record]]
id = "max-test-share-of-the-rate-cap"
kind = "interpretation"
summary = "A Test without an Operator Key may state at most a share of the Admitted Rate Cap, all its Test Connections together: half by default, so at least two Tests can run whatever one states. An activated Test holds its whole maxBandwidth for its whole Test Interval, whatever it sends. A Setup past the share gets CAPEXC."
rfc = "RFC 9946 §11"
requirements = ["RFC9946-11-4"]
obudpst = "OB-UDPST lets one Test take the whole cap."
