[[record]]
id = "admitted-rate-cap-per-direction"
kind = "interpretation"
summary = "The Admitted Rate Cap applies to each direction separately: Upstream and Downstream Test Connections each sum their stated maxBandwidth (CHSR_USDIR_BIT masked) against it, as a link carries its rate both ways. docs/spec.md says a cap on total admitted maxBandwidth. A Setup Request stating no maxBandwidth is refused with NOMAXBW only when the Server requires one."
rfc = "RFC 9946 §6.1"
requirements = ["RFC9946-6.1-L7", "RFC9946-6.1-L8"]
obudpst = "OB-UDPST also keeps a pool per direction, but with -B set it always refuses a maxBandwidth of 0 with NOMAXBW."
