# Fuzz targets for the PDU decoders, the Server core and its
# Admission, outside the workspace because cargo-fuzz needs nightly
# Rust (spec ). docs/testing.md ("Fuzzing") says how to run them.
[package]
name = "udpstp-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13", features = ["arbitrary-derive"] }
# Targets compile the application's maintained source modules directly.
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["derive", "serde"] }

[features]
default = ["fuzzing"]
fuzzing = []

# Its own workspace, so the main one's toolchain and lints don't apply.
[workspace]

[lints.rust]
unsafe_code = "forbid"
# These application-only features remain disabled in the included sources.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("hotpath", "layout-diagnostics"))'] }

[[bin]]
name = "setup_pdu"
path = "fuzz_targets/setup_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "activation_pdu"
path = "fuzz_targets/activation_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "null_pdu"
path = "fuzz_targets/null_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_pdu"
path = "fuzz_targets/load_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "status_pdu"
path = "fuzz_targets/status_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_core"
path = "fuzz_targets/server_core.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission"
path = "fuzz_targets/admission.rs"
test = false
doc = false
bench = false
