[round]
kind = "server-scale"
test_interval = 5
warm_up = 1
engines = ["udpstp", "obudpst"]
calibration = []
obudpst_pinned = true
obudpst_instances = 1
must_have = "obudpst"
reading = "home-lab"
runs_at_target = { udpstp = 1, obudpst = 1 }
runs_elsewhere = 1
probe_stop_engines = ["udpstp"]
probe_stop_cases = ["H4"]
close_call_runs = 0
close_call_most = 0
client_env = { UDPSTP_ENGINE_HOLD_OFF_US = "250" }
executor = "pool"

[confine]
candidates = ["1,5"]
count = 4
runs = 1

[[case]]
name = "H4"
direction = "downstream"
row = 4
counts = [4]
target = 4

[[case]]
name = "H4u"
direction = "upstream"
row = 4
counts = [4]
target = 4

[[case]]
name = "H4c"
direction = "downstream"
row = 4
counts = [4]
target = 4
confined = true

[[case]]
name = "H4uc"
direction = "upstream"
row = 4
counts = [4]
target = 4
confined = true

[grouping]
case = "H4c"
arm = "H4cw50"

[[case]]
name = "H4cw50"
direction = "downstream"
row = 4
counts = [4]
target = 4
judged = false
engines = ["udpstp"]
confined_as = "H4c"
server_env = { UDPSTP_ENGINE_GROUPING_US = "50" }

[precision]
pairs = [["S500", "S500ptc"], ["S900", "S900ptc"]]

[[case]]
name = "S500"
direction = "downstream"
row = 500
counts = [1]
target = 1
judged = false
runs = 1
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "pool", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }

[[case]]
name = "S500ptc"
direction = "downstream"
row = 500
counts = [1]
target = 1
judged = false
runs = 1
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "per-test-connection", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }

[[case]]
name = "S900"
direction = "downstream"
row = 900
counts = [1]
target = 1
judged = false
runs = 1
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "pool", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }

[[case]]
name = "S900ptc"
direction = "downstream"
row = 900
counts = [1]
target = 1
judged = false
runs = 1
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "per-test-connection", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }
