
[round]
kind = "server-scale"
test_interval = 10
warm_up = 2
engines = ["udpstp", "obudpst"]
calibration = []
obudpst_pinned = true
must_have = "obudpst"
reading = "home-lab"
runs_at_target = { udpstp = 10, obudpst = 10 }
runs_elsewhere = 5
probe_stop_engines = ["udpstp"]
probe_stop_cases = ["H4"]
close_call_runs = 3
close_call_most = 20
client_env = { UDPSTP_ENGINE_HOLD_OFF_US = "250" }
executor = "pool"

[confine]
candidates = ["1,5"]
count = 150
runs = 1

[[case]]
name = "H4"
direction = "downstream"
row = 4
counts = [150]
target = 150
runs = 5

[[case]]
name = "H4c"
direction = "downstream"
row = 4
counts = [25, 50, 75, 100, 125, 150]
target = 150
confined = true

[grouping]
case = "H4c"
arm = "H4cw50"

[[case]]
name = "H4cw50"
direction = "downstream"
row = 4
counts = [125, 150]
target = 150
judged = false
engines = ["udpstp"]
confined_as = "H4c"
server_env = { UDPSTP_ENGINE_GROUPING_US = "50" }

[precision]
pairs = [["S500", "S500ptc"], ["S900", "S900ptc"]]

[[case]]
name = "S500"
direction = "downstream"
row = 500
counts = [1]
target = 1
judged = false
runs = 5
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "pool", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }

[[case]]
name = "S500ptc"
direction = "downstream"
row = 500
counts = [1]
target = 1
judged = false
runs = 5
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "per-test-connection", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }

[[case]]
name = "S900"
direction = "downstream"
row = 900
counts = [1]
target = 1
judged = false
runs = 5
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "pool", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }

[[case]]
name = "S900ptc"
direction = "downstream"
row = 900
counts = [1]
target = 1
judged = false
runs = 5
engines = ["udpstp"]
server_env = { UDPSTP_ENGINE_EXECUTOR = "per-test-connection", UDPSTP_KERNEL_TX_TIMESTAMPS = "1" }
