name: Interop report
description: Results of running udpstp against another UDPSTP implementation.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What interoperability problem or result did you observe?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What should happen between these implementations?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include both implementations and versions, Client and Server roles, Upstream or Downstream direction, Authentication Mode, commands and output from both ends where available. Remove Shared Keys and other private data. Say which details are unknown.
    validations:
      required: true
