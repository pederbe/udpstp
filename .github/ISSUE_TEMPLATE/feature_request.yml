name: Feature request
description: Something udpstp should do that it doesn't.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: If it relates to RFC 9946 or RFC 9097, cite the section.
