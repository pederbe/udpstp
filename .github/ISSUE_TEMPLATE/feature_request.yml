name: Feature request
description: Something udpstp should do that it doesn't.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What would udpstp let you do? You do not need to design the solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Examples, workarounds or relevant links, if available. Cite the section for a request related to RFC 9946 or RFC 9097.
