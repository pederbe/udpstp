name: Bug report
description: udpstp does something wrong, or crashes.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What happened, and how does it affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What should happen instead? You do not need to propose a fix.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include commands, relevant configuration, udpstp version or commit, both operating systems, and output from the Client and Server where available. Remove Shared Keys and other private data. Describe your observations even if you cannot reproduce the problem yet, and say which details are unknown.
    validations:
      required: true
