name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after checking, requires website activation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-delivery
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build and check without deployment
        run: UDPSTP_SITE_REF="$GITHUB_SHA" bash scripts/build-site.sh
      - name: Check the committed social image against its source
        run: node website/render.mjs "$RUNNER_TEMP/social-check" --check-social
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ github.sha }}
          path: target/site/public
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: >-
      !cancelled() && (github.event_name == 'push' || inputs.deploy) &&
      vars.WEBSITE_ENABLED == 'true' &&
      !github.event.repository.private && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: website-${{ github.sha }}
          path: target/site/public
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - name: Require the checked main revision and deploy its retained files
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$head" = "$SOURCE"
          test -f target/site/public/index.html
          test -f target/site/public/docs/index.html
          test -f target/site/public/sitemap.xml
          test -f target/site/public/og.png
          npx --yes wrangler@4.147.0 deploy --config website/wrangler.jsonc
          curl --fail --retry 5 --retry-delay 3 https://udpstp.com/ > /dev/null
          curl --fail --retry 5 --retry-delay 3 https://udpstp.com/docs/ > /dev/null
          curl --fail --retry 5 --retry-delay 3 https://udpstp.com/docs/getting-started.html > /dev/null
