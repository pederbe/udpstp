name: Windows service

# Bounded checks on disposable runners, started only by the maintainer.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-service-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        fixture: [windows-service-check, windows-key-service-check]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p udpstp
      - name: Service fixture
        run: |
          & "scripts/${{ matrix.fixture }}.ps1" -Udpstp target/debug/udpstp.exe -AllowMachineChanges -Evidence "$env:RUNNER_TEMP/windows-service"
      - name: Save service evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.fixture }}-${{ github.sha }}
          path: ${{ runner.temp }}/windows-service
          retention-days: 3
          if-no-files-found: warn
