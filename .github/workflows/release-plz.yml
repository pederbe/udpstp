name: Release-plz

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz
  cancel-in-progress: false
  queue: max

jobs:
  release-pr:
    if: >-
      github.repository == 'pederbe/udpstp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Prepare weekly release or refresh an open release pull request
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-plz-"))] | length')
            if [ "$open" = 0 ]; then
              echo run=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo run=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.prepare.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
        if: steps.prepare.outputs.run == 'true'
      - id: release-plz
        if: steps.prepare.outputs.run == 'true'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Refresh the release pull request's fuzz lockfile
        id: fuzz-lock
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr || '{}').head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git fetch origin "refs/heads/$RELEASE_BRANCH"
          git switch --detach FETCH_HEAD
          cargo update --manifest-path fuzz/Cargo.toml --workspace
          if ! git diff --quiet -- fuzz/Cargo.lock; then
            git add fuzz/Cargo.lock
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh fuzz lockfile for release'
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
      - name: Merge the release pull request once CI passes
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: gh pr merge "$(jq -r .number <<< "$PR")" --repo "$GITHUB_REPOSITORY" --squash --auto

  release:
    if: github.repository == 'pederbe/udpstp' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Workflow-token events do not start other workflows. Dispatch the
      # binary build explicitly after release-plz has published and tagged it.
      - name: Build the binary release assets
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.[] | select(.package_name == "udpstp") | .tag' <<< "$RELEASES")
          if [ -n "$tag" ]; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          fi
