# The colour pairs udpstp.com uses, checked by `cargo xtask site contrast`
# (and by `cargo xtask site check`) against WCAG 2.2 AA: 4.5:1 for text,
# 3:1 for large text (the H1) and for UI such as borders and focus rings.
# Each palette's tokens are read from its stylesheet, from the block after
# `/* tokens: <name> */`.

[[palette]]
name = "landing dark"
file = "website/landing.css"
pairs = [
  { fg = "text", bg = "bg", min = 4.5, use = "body text" },
  { fg = "text", bg = "surface", min = 4.5, use = "text on panels, tabs, terminal" },
  { fg = "muted", bg = "bg", min = 4.5, use = "secondary text" },
  { fg = "muted", bg = "surface", min = 4.5, use = "secondary text on panels" },
  { fg = "signal", bg = "bg", min = 4.5, use = "links, eyebrow, H1, key figures" },
  { fg = "signal", bg = "surface", min = 4.5, use = "terminal prompt and headings, key figures on the proof panel" },
  { fg = "terminal-success", bg = "surface", min = 4.5, use = "terminal Maximum IP-Layer Capacity result" },
  { fg = "accent-text", bg = "surface", min = 4.5, use = "terminal not measured markers" },
  { fg = "signal-hover", bg = "bg", min = 4.5, use = "hovered links" },
  { fg = "accent-text", bg = "bg", min = 4.5, use = "the footnote star" },
  { fg = "on-accent", bg = "accent", min = 4.5, use = "primary button and Copy text" },
  { fg = "on-accent", bg = "accent-hover", min = 4.5, use = "hovered primary button" },
  { fg = "edge", bg = "bg", min = 3, use = "coral outer lines" },
  { fg = "accent", bg = "bg", min = 3, use = "accent-edge button border" },
  { fg = "signal", bg = "surface", min = 3, use = "install box stroke, focus ring" },
  { fg = "text", bg = "table-row-bg", min = 4.5, use = "table text, inline code and numbers" },
  { fg = "muted", bg = "table-row-bg", min = 4.5, use = "table descriptions and comparison text" },
  { fg = "signal", bg = "table-row-bg", min = 4.5, use = "table links and focus" },
  { fg = "signal-hover", bg = "table-row-bg", min = 4.5, use = "hovered table links" },
  { fg = "text", bg = "table-row-alternate", min = 4.5, use = "table text, inline code and numbers" },
  { fg = "muted", bg = "table-row-alternate", min = 4.5, use = "table descriptions and comparison text" },
  { fg = "signal", bg = "table-row-alternate", min = 4.5, use = "table links and focus" },
  { fg = "signal-hover", bg = "table-row-alternate", min = 4.5, use = "hovered table links" },
]

