# The glossary lint's exceptions (`cargo xtask glossary`; CONTRIBUTING.md).
# Add an entry only for a true exception, never to silence drift: use the
# glossary's term instead. An entry that exempts nothing fails the check.
#
# [[allow]] exempts a finding in the files `path` matches (a glob: `*`
# within a path segment, `**` across segments) when an occurrence of
# `pattern` in its line covers it. The pattern is case-sensitive; `*` in it
# stands for any run of characters.
#
# [[unchecked]] names an avoided term that is never checked: an ordinary
# word whose avoided sense only a reader can tell from its other senses.

# GLOSSARY.md itself.

[[allow]]
path = "GLOSSARY.md"
pattern = "_Avoid_: *"
reason = "The _Avoid_ lists name the avoided terms."

# Names the glossary doesn't govern.

[[allow]]
path = "**"
pattern = "UDP Speed Test Protocol"
reason = "The protocol's name, RFC 9946's title."

# Other senses of an avoided phrase.

[[allow]]
path = "docs/security.md"
pattern = "no extra grace period"
reason = "The authUnixTime time window's edges, not the catch-up budget."

# Ordinary words.

[[unchecked]]
term = "run"
reason = "A Client runs a Test; the glossary says so itself."

[[unchecked]]
term = "path"
reason = "The network path between the Client and the Server, RFC 9097's term."

[[unchecked]]
term = "Src"
reason = "Every crate's src directory."

[[unchecked]]
term = "Mode"
reason = "Avoided only unqualified: mode 1 and mode 2 are the Authentication Modes."

[[unchecked]]
