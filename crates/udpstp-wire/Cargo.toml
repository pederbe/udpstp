[package]
name = "udpstp-wire"
version = "0.1.3"
description = "UDPSTP (RFC 9946) PDU layouts and codecs"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The tests need the workspace (udpstp-req, testdata/), so they aren't
# packaged.
exclude = ["tests/"]
keywords = ["rfc9946", "udpstp", "speedtest", "protocol", "codec"]
categories = ["network-programming", "encoding", "parser-implementations"]

[dev-dependencies]
udpstp-req.workspace = true

[lints]
workspace = true

[dependencies]
hmac.workspace = true
sha2.workspace = true
zeroize.workspace = true
