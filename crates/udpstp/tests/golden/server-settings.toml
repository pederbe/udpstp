listen = ["192.0.2.1", "2001:db8::1"]
port = 24700
allow_unauthenticated = true
checksum = true
jumbo = false
traditional_mtu = true
server_mtu = 9000
ephemeral_ports = "40000-40999"
delay_var_statistic = "average"
tests_per_source = 2
max_test_connections = 512
test_connections_per_test = 16
max_unactivated_test_connections = 64
admitted_rate_cap = 10000
max_test_share = 25
require_max_bandwidth = true
troubleshooting = true
unverified_setups_per_second = 1000
source_setup_burst = 32
source_setups_per_second = 2
key_setup_burst = 500
key_setups_per_second = 200
allowed_dscp = [0, 46]
operator_allowed_dscp = [0, 10, 46]
max_start_row = 50
quota_period = 86400
source_tests_per_quota_period = 24
source_bytes_per_quota_period = 10000000000
socket_buffer_size = 4194304
dont_fragment = false
max_hops = 12
log_format = "json"
log_file = "/var/log/udpstp/server.log"
address_privacy = "pseudonymize"
address_privacy_key_file = "/etc/udpstp/pseudonym.key"
statistics_interval = 300
key_file = "/etc/udpstp/keys.toml"
