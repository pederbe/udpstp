[workspace]
# Publish the existing Cargo packages in dependency order. Only the binary
# creates a GitHub release, whose assets are built by release.yml.
git_release_enable = false
changelog_update = false
release_always = false
pr_name = "chore: release{% if version %} v{{ version }}{% endif %}"
release_commits = '^(feat|fix|perf|docs|revert)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:|^[A-Z]|BREAKING[ -]CHANGE'

[[package]]
name = "udpstp-wire"
version_group = "udpstp"

[[package]]
name = "udpstp-core"
version_group = "udpstp"

[[package]]
name = "udpstp-runtime"
version_group = "udpstp"

[[package]]
name = "udpstp-key-permissions"
version_group = "udpstp"

[[package]]
name = "udpstp"
version_group = "udpstp"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["udpstp-wire", "udpstp-core", "udpstp-runtime", "udpstp-key-permissions"]
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = true
git_release_name = "udpstp v{{ version }}"

[[package]]
name = "udpstp-req"
release = false

[[package]]
name = "bench-rounds"
release = false

[[package]]
name = "udpstp-bench"
release = false

[[package]]
name = "xtask"
release = false

[changelog]
header = """# Changelog

## [Unreleased]
"""
body = """

## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | unique(attribute="message") %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}

{{ commit.breaking_description | trim }}

{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
sort_commits = "oldest"
protect_breaking_commits = true
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/pederbe/udpstp/pull/${1}))" },
]
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = "BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat(\\([^)]*\\))?:", group = "<!-- 1 -->Added" },
  { message = "^fix\\(deps\\):", group = "<!-- 4 -->Dependencies" },
  { message = "^fix(\\([^)]*\\))?:", group = "<!-- 2 -->Fixed" },
  { message = "^perf(\\([^)]*\\))?:", group = "<!-- 3 -->Performance" },
  { message = "^docs(\\([^)]*\\))?:", group = "<!-- 5 -->Documentation" },
  { message = "^(chore|ci|build|test|style|refactor)(\\([^)]*\\))?:", skip = true },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]
